<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Smart Canteen — Student Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal-dark:  #1a2e2a;
    --teal-btn:   #2d7a6e;
    --teal-light: #3aa896;
    --text-main:  #0f1a18;
    --text-muted: #5a7570;
    --bg-page:    #f0f4f3;
    --border:     #e0eae8;
    --radius:     14px;
  }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg-page); color: var(--text-main); min-height: 100vh; }

  /* ===== NAV ===== */
  nav {
    background: var(--teal-dark);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 64px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .logo-icon { width: 40px; height: 40px; background: var(--teal-btn); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: #fff; letter-spacing: -0.5px; }
  .logo-text { display: flex; flex-direction: column; }
  .logo-title { color: #fff; font-weight: 700; font-size: 14px; letter-spacing: 0.05em; }
  .logo-sub   { color: #8bb8b0; font-size: 10px; letter-spacing: 0.12em; }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a {
    color: #b0cec9; text-decoration: none; font-size: 14px; font-weight: 500;
    padding: 8px 16px; border-radius: 8px; transition: background 0.15s, color 0.15s;
  }
  .nav-links a:hover, .nav-links a.active { background: rgba(255,255,255,0.1); color: #fff; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .nav-user  { color: #b0cec9; font-size: 13px; }
  .btn-logout { background: none; border: 1px solid rgba(255,255,255,0.2); color: #b0cec9; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; transition: background 0.15s; }
  .btn-logout:hover { background: rgba(255,255,255,0.1); color: #fff; }

  /* ===== PAGE BADGE ===== */
  .portal-badge-bar {
    padding: 12px 40px;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .portal-badge {
    display: inline-block;
    background: #f0f4f3;
    color: var(--text-muted);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
  }

  /* ===== MAIN LAYOUT ===== */
  .wrap { max-width: 1140px; margin: 0 auto; padding: 32px 24px; }
  .page-title { font-size: 30px; font-weight: 800; margin-bottom: 24px; color: var(--text-main); }

  /* ===== STATS BAR ===== */
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 180px;
  }
  .stat-chip-label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .stat-chip-value { font-size: 24px; font-weight: 800; color: var(--text-main); margin-left: auto; }
  .stat-chip-value.highlight { color: #d97706; }
  .stat-chip-value.time { font-size: 18px; }

  /* ===== CONTENT GRID ===== */
  .content-grid {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
    align-items: start;
  }

  /* ===== FILTER BAR ===== */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn {
    padding: 7px 16px; border-radius: 999px; border: 1.5px solid var(--border);
    background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    color: var(--text-muted); transition: all 0.15s;
  }
  .filter-btn.active, .filter-btn:hover { background: var(--teal-dark); color: #fff; border-color: var(--teal-dark); }

  /* ===== MENU GRID ===== */
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .menu-card {
    background: #fff; border-radius: 16px; padding: 20px;
    border: 1.5px solid var(--border); transition: transform 0.15s, box-shadow 0.15s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .menu-card:hover { transform: translateY(-3px); box-shadow: 0 6px 24px rgba(26,46,42,0.10); }
  .menu-card.sold-out { opacity: 0.55; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .item-cat-badge {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    background: #f0f4f3; padding: 3px 9px; border-radius: 6px; letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .item-price-badge { font-size: 13px; font-weight: 700; color: var(--text-main); }
  .item-name { font-size: 17px; font-weight: 800; color: var(--text-main); }
  .item-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; min-height: 36px; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .item-avail { font-size: 12px; color: var(--text-muted); }
  .item-wait  { font-size: 12px; color: var(--text-muted); }
  .btn-add {
    width: 100%; padding: 10px; background: var(--teal-dark); color: #fff;
    border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: background 0.15s; margin-top: 4px;
  }
  .btn-add:hover { background: var(--teal-btn); }
  .btn-add:disabled { background: #ccc; cursor: not-allowed; }

  /* ===== CART SIDEBAR ===== */
  .cart-sidebar {
    background: #fff;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    padding: 20px;
    position: sticky;
    top: 80px;
  }
  .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .cart-title { font-size: 16px; font-weight: 700; }
  .cart-count { font-size: 13px; color: var(--text-muted); }
  .cart-empty { color: var(--text-muted); font-size: 13px; padding: 8px 0 16px; line-height: 1.6; }
  .cart-item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 14px; font-weight: 600; }
  .cart-item-price { font-size: 13px; color: var(--text-muted); }
  .cart-qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .qty-btn { width: 26px; height: 26px; border: 1.5px solid var(--border); background: #fff; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-main); transition: background 0.1s; }
  .qty-btn:hover { background: var(--bg-page); }
  .qty-num { font-size: 14px; font-weight: 700; min-width: 18px; text-align: center; }

  .cart-divider { margin: 16px 0; border: none; border-top: 1px solid var(--border); }
  .pickup-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.05em; }
  .pickup-select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 14px; color: var(--text-main); background: #fafcfb;
    outline: none; transition: border-color 0.15s; margin-bottom: 14px;
  }
  .pickup-select:focus { border-color: var(--teal-btn); }
  .cart-subtotal-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .subtotal-label { font-size: 14px; color: var(--text-muted); }
  .subtotal-value { font-size: 16px; font-weight: 800; }
  .btn-place-order {
    width: 100%; padding: 13px; background: var(--teal-btn); color: #fff;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-place-order:hover { background: #26695e; transform: translateY(-1px); }
  .btn-place-order:disabled { background: #ccc; cursor: not-allowed; transform: none; }

  /* ===== STATUS BANNER ===== */
  .status-banner {
    background: #ecfdf5; border: 1px solid #10b981; color: #065f46;
    padding: 14px 18px; border-radius: 12px; margin-bottom: 20px;
    font-size: 14px; display: none; font-weight: 500;
  }

  /* ===== MY ORDERS ===== */
  .orders-section { margin-top: 36px; }
  .section-head { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
  .order-row {
    background: #fff; border-radius: 12px; padding: 14px 18px;
    border: 1px solid var(--border); display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 10px; gap: 12px;
  }
  .order-item-name { font-weight: 600; font-size: 14px; }
  .order-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .order-badge { padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge-Placed    { background: #fef3c7; color: #92400e; }
  .badge-Cooking   { background: #dbeafe; color: #1e40af; }
  .badge-Ready     { background: #d1fae5; color: #065f46; }
  .badge-Completed { background: #f3f4f6; color: #6b7280; }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 14px; }

  @media (max-width: 800px) {
    nav { padding: 0 16px; }
    .portal-badge-bar { padding: 10px 16px; }
    .wrap { padding: 20px 16px; }
    .content-grid { grid-template-columns: 1fr; }
    .cart-sidebar { position: static; }
    .stats-bar { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ===== NAV ===== -->
<nav>
  <a class="nav-logo" href="/">
    <div class="logo-icon">SC</div>
    <div class="logo-text">
      <div class="logo-title">SMART CANTEEN</div>
      <div class="logo-sub">AURIX NEXUS</div>
    </div>
  </a>
  <div class="nav-links">
    <a href="/">Overview</a>
    <a href="/student.html" class="active">Student</a>
    <a href="/staff.html">Staff</a>
    <a href="/admin.html">Admin</a>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- ===== PORTAL BADGE ===== -->
<div class="portal-badge-bar">
  <span class="portal-badge">STUDENT PORTAL</span>
</div>

<!-- ===== MAIN ===== -->
<div class="wrap">
  <div class="page-title">Today's live menu</div>

  <div class="status-banner" id="statusBanner"></div>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat-chip">
      <span class="stat-chip-label">Live orders</span>
      <span class="stat-chip-value" id="statLiveOrders">—</span>
    </div>
    <div class="stat-chip">
      <span class="stat-chip-label">Ready alerts</span>
      <span class="stat-chip-value highlight" id="statReady">—</span>
    </div>
    <div class="stat-chip">
      <span class="stat-chip-label">Student queue</span>
      <span class="stat-chip-value time" id="statQueue">— min</span>
    </div>
  </div>

  <!-- Content Grid: Menu + Cart -->
  <div class="content-grid">
    <!-- Menu Column -->
    <div>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
        <button class="filter-btn" onclick="setFilter('Breakfast', this)">Breakfast</button>
        <button class="filter-btn" onclick="setFilter('Lunch', this)">Lunch</button>
        <button class="filter-btn" onclick="setFilter('Snacks', this)">Snacks</button>
        <button class="filter-btn" onclick="setFilter('Beverages', this)">Beverages</button>
      </div>
      <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar">
      <div class="cart-header">
        <span class="cart-title">Cart</span>
        <span class="cart-count" id="cartCount">0 items</span>
      </div>

      <div id="cartEmpty" class="cart-empty">Your cart is empty. Add a few items to begin.</div>
      <div id="cartItems"></div>

      <hr class="cart-divider">

      <div class="pickup-label">PICKUP SLOT</div>
      <select id="pickupSlot" class="pickup-select">
        <option>12:00 PM</option>
        <option selected>12:30 PM</option>
        <option>1:00 PM</option>
        <option>1:30 PM</option>
        <option>2:00 PM</option>
      </select>

      <div class="cart-subtotal-row">
        <span class="subtotal-label">Subtotal</span>
        <span class="subtotal-value" id="cartSubtotal">₹0</span>
      </div>

      <button class="btn-place-order" id="placeOrderBtn" onclick="placeAllOrders()">Place Order</button>
    </div>
  </div>

  <!-- My Orders -->
  <div class="orders-section" id="myOrdersSection" style="display:none">
    <div class="section-head">My Recent Orders</div>
    <div id="myOrders"></div>
  </div>
</div>

<script>
/* ============================================================ AUTH */
const token = localStorage.getItem('sc_token');
const user  = JSON.parse(localStorage.getItem('sc_user') || 'null');

if (!token || !user) {
  window.location.href = '/#login';
}

document.getElementById('navUser').textContent = `👤 ${user ? user.username : ''}`;

function logout() {
  localStorage.removeItem('sc_token');
  localStorage.removeItem('sc_user');
  window.location.href = '/';
}

function setAdminRole() {
  sessionStorage.setItem('sc_nav_role', 'admin');
}

/* ============================================================ STATE */
let allItems      = [];
let currentFilter = 'All';
let cart          = {}; // { item_id: { item, qty } }
let sessionOrders = [];

/* ============================================================ STATS */
async function loadStats() {
  try {
    const res = await fetch('/api/orders', { headers: { Authorization: 'Bearer ' + token } });
    if (res.ok) {
      const orders = await res.json();
      const live    = orders.filter(o => o.status !== 'Completed').length;
      const ready   = orders.filter(o => o.status === 'Ready').length;
      const queue   = Math.max(5, Math.round(live * 0.5));
      document.getElementById('statLiveOrders').textContent = live;
      document.getElementById('statReady').textContent      = ready;
      document.getElementById('statQueue').textContent      = queue + ' min';
    }
  } catch(_) {
    document.getElementById('statLiveOrders').textContent = '24';
    document.getElementById('statReady').textContent      = '2';
    document.getElementById('statQueue').textContent      = '12 min';
  }
}

/* ============================================================ MENU */
async function loadMenu() {
  try {
    const res = await fetch('/api/items');
    allItems = await res.json();
    renderMenu();
  } catch(e) {
    document.getElementById('menuGrid').innerHTML =
      '<p style="color:#dc2626;padding:20px">Could not load menu. Is the server running?</p>';
  }
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMenu();
}

// Item descriptions (static, augmented for display)
const DESCRIPTIONS = {
  'Masala Dosa': 'Crispy dosa with potato masala.',
  'Veg Rice':    'Fresh vegetable rice bowl.',
  'Veg Noodles': 'Stir-fried noodles with veggies.',
  'Idli':        'Soft idlis with sambar & chutney.',
  'Vada':        'Crispy medu vada with chutney.',
  'Lemon Rice':  'Tangy lemon rice with peanuts.',
};

function renderMenu() {
  const grid  = document.getElementById('menuGrid');
  const items = currentFilter === 'All' ? allItems : allItems.filter(i => i.category === currentFilter);
  if (!items.length) {
    grid.innerHTML = '<div class="empty-state">No items in this category.</div>';
    return;
  }
  grid.innerHTML = '';
  items.forEach(it => {
    const soldOut = it.stock <= 0;
    const wait    = Math.max(8, Math.round(it.stock / 2));
    const desc    = DESCRIPTIONS[it.name] || '';
    const card    = document.createElement('div');
    card.className = 'menu-card' + (soldOut ? ' sold-out' : '');
    card.innerHTML = `
      <div class="card-top">
        <span class="item-cat-badge">${it.category}</span>
        <span class="item-price-badge">₹${it.price}</span>
      </div>
      <div class="item-name">${it.name}</div>
      <div class="item-desc">${desc}</div>
      <div class="card-footer">
        <span class="item-avail">Available: ${it.stock}</span>
        <span class="item-wait">${wait} min</span>
      </div>
      <button class="btn-add" ${soldOut ? 'disabled' : ''} onclick='addToCart(${JSON.stringify(it)})'>
        ${soldOut ? 'Sold Out' : '+ Add'}
      </button>
    `;
    grid.appendChild(card);
  });
}

/* ============================================================ CART */
function addToCart(item) {
  if (cart[item.id]) {
    if (cart[item.id].qty < item.stock) cart[item.id].qty++;
  } else {
    cart[item.id] = { item, qty: 1 };
  }
  renderCart();
}

function changeQty(itemId, delta) {
  if (!cart[itemId]) return;
  cart[itemId].qty += delta;
  if (cart[itemId].qty <= 0) delete cart[itemId];
  renderCart();
}

function renderCart() {
  const entries = Object.values(cart);
  const count   = entries.reduce((s, e) => s + e.qty, 0);
  const total   = entries.reduce((s, e) => s + e.qty * e.item.price, 0);

  document.getElementById('cartCount').textContent   = `${count} item${count !== 1 ? 's' : ''}`;
  document.getElementById('cartSubtotal').textContent = `₹${total}`;
  document.getElementById('cartEmpty').style.display  = entries.length ? 'none' : 'block';

  const cartItemsEl = document.getElementById('cartItems');
  cartItemsEl.innerHTML = entries.map(e => `
    <div class="cart-item-row">
      <div class="cart-item-info">
        <div class="cart-item-name">${e.item.name}</div>
        <div class="cart-item-price">₹${e.item.price} each</div>
      </div>
      <div class="cart-qty-ctrl">
        <button class="qty-btn" onclick="changeQty(${e.item.id}, -1)">−</button>
        <span class="qty-num">${e.qty}</span>
        <button class="qty-btn" onclick="changeQty(${e.item.id}, 1)">+</button>
      </div>
    </div>
  `).join('');
}

/* ============================================================ PLACE ORDER */
async function placeAllOrders() {
  const entries = Object.values(cart);
  if (!entries.length) { showBanner('Your cart is empty! Add items to continue.'); return; }

  const slot = document.getElementById('pickupSlot').value;
  const studentName = user.username || 'Student';
  const btn = document.getElementById('placeOrderBtn');
  btn.textContent = 'Redirecting to Payment…';
  btn.disabled = true;

  const results = [];
  const checkoutItems = [];

  for (const e of entries) {
    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ student_name: studentName, item_id: e.item.id, quantity: e.qty, slot })
      });
      const data = await res.json();
      if (res.ok) {
        results.push({ id: data.order_id, item_name: e.item.name, quantity: e.qty, slot, status: 'Placed' });
        checkoutItems.push({ name: e.item.name, price: e.item.price, qty: e.qty });
      } else {
        showBanner(`❌ ${e.item.name}: ${data.error || 'Failed'}`);
      }
    } catch(_) {
      showBanner('Network error — is the server running?');
    }
  }

  if (results.length) {
    cart = {};
    renderCart();

    // Store checkout info for payment page
    sessionStorage.setItem('sc_checkout_order', JSON.stringify({
      orderId: results[0].id,
      items: checkoutItems,
      slot: slot
    }));

    // Redirect to payment page
    window.location.href = '/payment.html';
    return;
  }

  btn.textContent = 'Place Order';
  btn.disabled = false;
}

/* ============================================================ BANNER */
function showBanner(msg) {
  const b = document.getElementById('statusBanner');
  b.textContent = msg;
  b.style.display = 'block';
  setTimeout(() => { b.style.display = 'none'; }, 6000);
}

/* ============================================================ MY ORDERS */
function renderMyOrders() {
  const section = document.getElementById('myOrdersSection');
  const el      = document.getElementById('myOrders');
  const storedRecent = JSON.parse(sessionStorage.getItem('sc_recent_orders') || '[]');
  const allOrders = [...sessionOrders, ...storedRecent];

  if (!allOrders.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  el.innerHTML = allOrders.map(o => `
    <div class="order-row">
      <div>
        <div class="order-item-name">${o.item_name}</div>
        <div class="order-meta">Qty ${o.quantity} · Pickup ${o.slot} · Order #${o.id}</div>
      </div>
      <span class="order-badge badge-${o.status}">${o.status}</span>
    </div>
  `).join('');
}

/* ============================================================ INIT */
renderCart();
loadMenu();
loadStats();
renderMyOrders();

// Check if returned from payment
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('payment') === 'success') {
  showBanner('✅ Payment Successful! Your order has been placed and sent to the kitchen.');
  renderMyOrders();
}

setInterval(loadMenu, 30000);
setInterval(loadStats, 15000);
</script>
</body>
</html>
